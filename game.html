<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Rock Paper Scissors</h1>

    <h2 id ="new-game" class="results">Make a choice!</h2>

    <div class="players">
      <h3>👦 Player <p id="player-score" class="me">0</p></h3>
      <h3>➖ Ties <p id="tie-score">0</p></h3>
      <h3>🤖 Computer <p id="cpu-score">0</p></h3>
    </div>

    <h3 class="results">📝 Result: <span id="result"></span></h3>

    <div class="game">
      <h3><span id="your-choice" class="me"></span></h3>
      <h3><span id="cpu-choice" class="cpu"></span></h3>
    </div>

    <div class="choices">
      <button id="Rock" class="rock"></button>
      <button id="Paper" class="paper"></button>
      <button id="Scissors" class="scissors"></button>
    </div>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
